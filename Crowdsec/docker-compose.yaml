services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
      GID: "${GID-1000}"
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/traefik"
    # depends_on:  #uncomment if running traefik in the same compose file
    #   - 'traefik'
    volumes:
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml
      - crowdsec-db:/var/lib/crowdsec/data/
      - traefik_traefik-logs:/var/log/traefik/:ro
    networks:
      - traefik_default
    restart: unless-stopped

  bouncer-traefik:
    image: docker.io/fbonalair/traefik-crowdsec-bouncer:latest
    container_name: bouncer-traefik
    environment:
      CROWDSEC_BOUNCER_API_KEY: $CROWDSEC_BOUNCER_API_KEY
      CROWDSEC_AGENT_HOST: crowdsec:8080
    networks:
      - traefik_default
    depends_on:
      - crowdsec
    restart: unless-stopped
networks:
  traefik_default:
    external: true
volumes:
  crowdsec-db:
  traefik_traefik-logs: # this will be the name of the volume from trarfic logs
    external: true # remove if traefik is running on same stack

# To test if crowdsec is working, you can run the following command to see the decisions made by crowdsec
# docker exec crowdsec cscli metrics
# docker exec crowdsec cscli decisions list
# docker exec crowdsec cscli decisions add --ip 192.168.xxx.xxx
# docker exec crowdsec cscli decisions delete --ip 192.168.xxx.xxx