apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: teleport-ingressroute-certificate
  namespace: teleport-cluster
spec:
  secretName: teleport-certificate-secret
  issuerRef:
    name: cloudflare-clusterissuer
    kind: ClusterIssuer
  dnsNames:
    - teleport.xxx.com
    - "*.teleport.xxx.com"