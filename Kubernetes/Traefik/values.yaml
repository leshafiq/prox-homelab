image:
  repository: traefik
  tag: v3.5.3
  pullPolicy: IfNotPresent
deployment:
  replicas: 1
  strategy:
    type: Recreate
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
service:
  enabled: true
  externalTrafficPolicy: Local
  type: LoadBalancer
  loadBalancerIP: "192.168.100.2"
  annotations: {}
  labels: {}
  loadBalancerSourceRanges: []
  externalIPs: []
  ports:
    web:
      port: 80
    websecure:
      port: 443
ports:
  web:
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    expose:
      default: true
    forwardedHeaders:
      trustedIPs:
        - 127.0.0.1/32
        - 10.42.0.0/16
        - 192.168.100.0/24
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host(`traefik.kube.shafiqtechub.com`)
    middlewares:
        - name: bouncer
        - name: authentik-middleware
    tls:
      secretName: traefik-certificate-secret
logs:
  general:
    level: ERROR
  access:
    enabled: true
experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      version: "v1.4.5"