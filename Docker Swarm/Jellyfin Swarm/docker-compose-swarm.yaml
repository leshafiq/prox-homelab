version: "3.9"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    environment:
      - TZ=Etc/UTC
    volumes:
      - /mnt/192.168.100.95/Share/Media:/Media

    networks:
      - traefik_traefik_proxy
    deploy:
      mode: replicated
      replicas: 1
      placement:
        preferences:
          - spread: node.id
      labels:
        - traefik.enable=true

        # Traefik HTTPS router
        - traefik.http.routers.jellyfin.rule=Host(`jlfin.local-swarm.shafiqtechub.com`)
        - traefik.http.routers.jellyfin.entrypoints=websecure
        - traefik.http.routers.jellyfin.tls=true
        - traefik.http.routers.jellyfin.tls.certresolver=le

        # Jellyfin service
        - traefik.http.services.jellyfin.loadbalancer.server.port=8096

networks:
  traefik_traefik_proxy:
    external: true