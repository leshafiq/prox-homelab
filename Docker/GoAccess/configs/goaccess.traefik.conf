tz Asia/Kuala_Lumpur
time-format %H:%M:%S
date-format %d/%b/%Y
# Traefik access log (all traffic) — uncomment to use instead of nginx log
# log-format %h %^ %^ [%d:%t %^] "%r" %s %b "%R" "%u" %^ "%^" "%^" %^
# log-file /srv/traefik-logs/access.log

# Nginx access log (goaccess subdomain only, but has User-Agent/OS data)
log-format COMBINED
log-file /srv/logs/access.log
output /srv/report/report.html
real-time-html true
ws-url wss://goaccess.example.com:443/ws
port 7890