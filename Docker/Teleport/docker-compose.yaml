services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.0.2
    container_name: teleport
    volumes:
      - ./config:/etc/teleport
      - ./data:/var/lib/teleport
    # -- (Optional) Traefik example configuration
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.teleport.loadbalancer.server.port=3080"
      - "traefik.http.services.teleport.loadbalancer.server.scheme=https"
      - "traefik.http.routers.teleport-http.entrypoints=web"
      - "traefik.http.routers.teleport-http.rule=HostRegexp(`^(?i)(?:[[:alnum:]]+(?:-+[[:alnum:]]+)*\\.)?teleport.local-lab.xxx.com(?::\\d+)?$`)"
      - "traefik.http.routers.teleport-https.entrypoints=websecure"
      - "traefik.http.routers.teleport-https.rule=HostRegexp(`^(?i)(?:[[:alnum:]]+(?:-+[[:alnum:]]+)*\\.)?teleport.local-lab.xxx.com(?::\\d+)?$`)"
      - "traefik.http.routers.teleport-https.tls=true"
      - "traefik.http.routers.teleport-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.teleport-https.tls.domains[0].main=teleport.local-lab.xxx.com"
      - "traefik.http.routers.teleport-https.tls.domains[0].sans=*.teleport.local-lab.xxx.com"

    networks:
      - traefik_default
      
    restart: unless-stopped
networks:
  traefik_default:
    external: true