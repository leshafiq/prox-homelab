services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.0.2
    container_name: teleport
    volumes:
      - ./config:/etc/teleport
      - ./data:/var/lib/teleport
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.teleport.loadbalancer.server.port=3080"
      - "traefik.http.services.teleport.loadbalancer.server.scheme=https"
      - "traefik.http.routers.teleport-http.entrypoints=web"
      - "traefik.http.routers.teleport-http.rule=HostRegexp(`^(?i)(?:[[:alnum:]]+(?:-+[[:alnum:]]+)*\\.)?teleport.example.com(?::\\d+)?$`)"
      - "traefik.http.routers.teleport-https.entrypoints=websecure"
      - "traefik.http.routers.teleport-https.rule=HostRegexp(`^(?i)(?:[[:alnum:]]+(?:-+[[:alnum:]]+)*\\.)?teleport.example.com(?::\\d+)?$`)"
      - "traefik.http.routers.teleport-https.tls=true"
      - "traefik.http.routers.teleport-https.tls.certresolver=cloudflare"
      - "traefik.http.routers.teleport-https.tls.domains[0].main=example.com"
      - "traefik.http.routers.teleport-https.tls.domains[0].sans=*.example.com"
      - "traefik.http.routers.teleport-https.tls.domains[1].main=teleport.example.com"
      - "traefik.http.routers.teleport-https.tls.domains[1].sans=*.teleport.example.com"
    networks:
      - traefik_default      
    restart: unless-stopped
    
networks:
  traefik_default:
    external: true
